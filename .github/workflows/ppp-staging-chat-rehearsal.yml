name: PPP Staging Automated Conversations

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/ppp-staging-chat-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: Execute bounded conversations on the single authorized test recipient
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ppp-staging-authorized-test-chat
  cancel-in-progress: false

jobs:
  conversations:
    if: >-
      github.repository == 'wilmerx5/PPP-NEST' &&
      github.ref == 'refs/heads/fix/whatsapp-regression-baseline' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '9014455ba7a36366ce36c93cce1a140a675bc699'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28a1c0be0a62becef5c1361c832e817cf885eec0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check runner isolation with synthetic secrets and no network
        run: node --test scripts/ppp-staging-chat-rehearsal.test.cjs
      - name: Verify staging and optionally execute bounded test conversations
        env:
          STAGING_CHAT_EXECUTE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execute) || (github.event_name == 'push' && github.event.before == '9014455ba7a36366ce36c93cce1a140a675bc699')) && 'true' || 'false' }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const emptyGuard = "ensure(initial.state === 'building_cart' && initial.sessionData.cart.length === 0, 'TEST_CHAT_HAS_EXISTING_DRAFT');";
          const marker = 'const plan = buildPlan(products);';
          const replacement = `const originalPlan = buildPlan(products);
            const restored = originalPlan[2].cart;
            const plan = [
              { id: 'recover-known-asada-quantity', text: 'Solo era una sobrebarriga asada', cart: restored },
              { id: 'duplicate-recovery-webhook', duplicatePrevious: true, cart: restored },
              ...originalPlan.slice(4)
            ];`;
          const source = fs.readFileSync('scripts/ppp-staging-chat-rehearsal.cjs', 'utf8');
          if (!source.includes(marker) || !source.includes(emptyGuard)) throw Error('CONTINUATION_MARKER_MISSING');
          const guarded = `const failedDraft = [{ productId: 17, quantity: 1, unitPrice: 38000, attrs: [], note: ['sin ensalada'], forbidNote: [] }, { productId: 13, quantity: 2, unitPrice: 33000, attrs: [{ attributeName: 'Seleccion', attributeValue: 'Asada' }], note: [], forbidNote: [] }, { productId: 13, quantity: 1, unitPrice: 33000, attrs: [{ attributeName: 'Seleccion', attributeValue: 'En Salsa' }], note: [], forbidNote: [] }];
            ensure(initial.state === 'building_cart' && cartMatches(failedDraft, initial.sessionData.cart), 'KNOWN_FAILED_DRAFT_CHANGED');
            ensure(initial.messages.filter(m => m.direction === 'in').at(-1)?.body === 'Quiero un churrasco sin ensalada y dos sobrebarrigas: una asada y otra en salsa.', 'CONTINUATION_INPUT_CHANGED');`;
          fs.writeFileSync('scripts/ppp-staging-cart-continuation.cjs', source.replace(emptyGuard, guarded).replace(marker, replacement).replace('existing_empty_test_conversation', 'existing_known_failed_test_draft'));
          require('./scripts/ppp-staging-cart-continuation.cjs').runRehearsal().then(report => {
            fs.mkdirSync('tmp', { recursive: true });
            fs.writeFileSync('tmp/ppp-staging-chat-report.json', JSON.stringify(report));
            console.log(JSON.stringify(report)); process.exitCode = report.ok ? 0 : 1;
          }).catch(() => { console.error('CART_CONTINUATION_FAILED'); process.exitCode = 1; });
          NODE
      - name: Archive counts and check results without credentials or message bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-chat-report
          path: tmp/ppp-staging-chat-report.json
          retention-days: 7
          if-no-files-found: ignore
