name: PPP Staging Automated Conversations

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/ppp-staging-chat-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: Execute bounded conversations on the single authorized test recipient
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ppp-staging-authorized-test-chat
  cancel-in-progress: false

jobs:
  conversations:
    if: >-
      github.repository == 'wilmerx5/PPP-NEST' &&
      github.ref == 'refs/heads/fix/whatsapp-regression-baseline' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '7d0f4107c665727b10c2dc83113daf41b05ae831'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28a1c0be0a62becef5c1361c832e817cf885eec0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check runner isolation with synthetic secrets and no network
        run: node --test scripts/ppp-staging-chat-rehearsal.test.cjs
      - name: Verify staging and optionally execute bounded test conversations
        env:
          STAGING_CHAT_EXECUTE: 'false'
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const marker = "if (report.mode === 'preflight') { report.ok = true; return report; }";
          const replacement = `if (report.mode === 'preflight') {
            const inbound = initial.messages.filter(m => m.direction === 'in').at(-1);
            ensure(inbound?.body === '¿Las costillas de cerdo traen ensalada?', 'DIAGNOSTIC_INPUT_CHANGED');
            const outgoing = initial.messages.filter(m => m.direction === 'out').at(-1);
            ensure(outgoing?.sentBy === 'bot', 'DIAGNOSTIC_REPLY_NOT_BOT');
            const reply = normalize(outgoing.body);
            report.replyFacts = {
              negativeNo: /\\bno\\b/.test(reply), negativeSin: /\\bsin\\b/.test(reply),
              mentionsSalad: reply.includes('ensalada'), mentionsYuca: reply.includes('yuca'),
              mentionsPotato: reply.includes('papa'), mentionsRice: reply.includes('arroz'),
              mentionsRibs: reply.includes('costilla'), replyLength: reply.length
            };
            report.ok = true; return report;
          }`;
          const source = fs.readFileSync('scripts/ppp-staging-chat-rehearsal.cjs', 'utf8');
          if (!source.includes(marker)) throw Error('DIAGNOSTIC_MARKER_MISSING');
          fs.writeFileSync('scripts/ppp-staging-readonly-diagnostic.cjs', source.replace(marker, replacement));
          require('./scripts/ppp-staging-readonly-diagnostic.cjs').runRehearsal().then(report => {
            fs.mkdirSync('tmp', { recursive: true });
            fs.writeFileSync('tmp/ppp-staging-chat-report.json', JSON.stringify(report));
            console.log(JSON.stringify(report)); process.exitCode = report.ok ? 0 : 1;
          }).catch(() => { console.error('READONLY_DIAGNOSTIC_FAILED'); process.exitCode = 1; });
          NODE
      - name: Archive counts and check results without credentials or message bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-chat-report
          path: tmp/ppp-staging-chat-report.json
          retention-days: 7
          if-no-files-found: ignore
