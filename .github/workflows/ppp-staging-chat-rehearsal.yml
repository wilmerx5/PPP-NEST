name: PPP Staging Automated Conversations

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/ppp-staging-chat-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: Execute bounded conversations on the single authorized test recipient
        type: boolean
        default: false
        required: false
      resume:
        description: Resume only the verified failed synthetic variant draft
        type: choice
        options: [fresh, known-variant-draft]
        default: fresh
        required: false

permissions:
  contents: read

concurrency:
  group: ppp-staging-authorized-test-chat
  cancel-in-progress: false

jobs:
  conversations:
    if: >-
      github.repository == 'wilmerx5/PPP-NEST' &&
      github.ref == 'refs/heads/fix/whatsapp-regression-baseline' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == 'fab88a20a5a4e8d325bdfbe02631430148413c98'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8df688154e2c0403b3bed7fd9efaac03131a802c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check runner isolation with synthetic secrets and no network
        run: node --test scripts/ppp-staging-chat-rehearsal.test.cjs
      - name: Verify staging and optionally execute bounded test conversations
        env:
          STAGING_CHAT_EXECUTE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execute) || (github.event_name == 'push' && github.event.before == 'fab88a20a5a4e8d325bdfbe02631430148413c98')) && 'true' || 'false' }}
          STAGING_CHAT_RESUME: ${{ inputs.resume == 'known-variant-draft' && 'known-variant-draft' || '' }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const marker = 'const plan = resumeKnownDraft ? buildKnownVariantResumePlan(products) : buildPlan(products);';
          const replacement = `ensure(!resumeKnownDraft && initial.messages.filter(m => m.direction === 'in').at(-1)?.body === 'Solo era una sobrebarriga asada', 'EMPTY_TEST_DRAFT_CHANGED'); const plan = buildPlan(products).slice(1);`;
          const source = fs.readFileSync('scripts/ppp-staging-chat-rehearsal.cjs', 'utf8');
          if (!source.includes(marker)) throw Error('CONTINUATION_MARKER_MISSING');
          fs.writeFileSync('scripts/ppp-staging-pending-steps.cjs', source.replace(marker,replacement));
          require('./scripts/ppp-staging-pending-steps.cjs').runRehearsal().then(report => {
            fs.mkdirSync('tmp', { recursive: true });
            fs.writeFileSync('tmp/ppp-staging-chat-report.json', JSON.stringify(report,null,2));
            console.log(JSON.stringify(report)); process.exitCode = report.ok ? 0 : 1;
          }).catch(() => { console.error('PENDING_STAGING_STEPS_FAILED'); process.exitCode = 1; });
          NODE
      - name: Archive counts and check results without credentials or message bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-chat-report
          path: tmp/ppp-staging-chat-report.json
          retention-days: 7
          if-no-files-found: ignore
