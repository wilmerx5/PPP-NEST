name: Nest CI

on:
  push:
    branches: [Main, main, master, develop]
  pull_request:
    branches: [Main, main, master, develop]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.build.json

      # Keep long conversation journeys and timer-sensitive suites in bounded groups.
      # The previous commands reran all WhatsApp cases in the general unit step.
      - name: Conversation journeys
        run: yarn jest --ci --testPathPattern=whatsapp-general-accuracy --maxWorkers=2 --testTimeout=20000

      - name: Remaining unit tests
        run: yarn jest --ci --testPathIgnorePatterns='whatsapp-general-accuracy|whatsapp-image-burst.spec.ts|whatsapp-webhook.controller.spec.ts' --maxWorkers=2 --testTimeout=20000

      - name: Timer-sensitive WhatsApp tests
        run: yarn jest --ci --runInBand --runTestsByPath src/whatsapp/whatsapp-image-burst.spec.ts src/whatsapp/whatsapp-webhook.controller.spec.ts --testTimeout=20000
