name: PPP Staging HTTPS Preflight

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/ppp-staging-http-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    # One authorized push, or an explicit dispatch on the same staging branch.
    # The script is immutable; neither PR code nor later branch edits receive secrets.
    if: github.repository == 'wilmerx5/PPP-NEST' && github.ref == 'refs/heads/fix/whatsapp-regression-baseline' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == 'f4a3818ad048a9e2dbc3a46c184c0c761744f92c'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4a3818ad048a9e2dbc3a46c184c0c761744f92c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the bounded HTTP probe without real secrets or network
        run: node --test scripts/ppp-staging-http-smoke.test.cjs
      - name: Check the remaining staff login and settings
        env:
          STAGING_HTTP_SCOPE: staff
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: node scripts/ppp-staging-http-smoke.cjs
      - name: Archive the sanitized HTTP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-http-${{ github.sha }}
          path: tmp/ppp-staging-http-smoke.json
          retention-days: 7
          if-no-files-found: ignore
