name: PPP Staging Checkout Flow Rehearsal

on:
  push:
    branches: [fix/whatsapp-checkout-flow-20261010]
    paths: [.github/workflows/ppp-staging-checkout-flow-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: Run the bounded checkout-flow rehearsal on the authorized recipient
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ppp-staging-authorized-checkout-flow
  cancel-in-progress: false

jobs:
  checkout-flow:
    if: >-
      github.repository == 'wilmerx5/PPP-NEST' &&
      github.ref == 'refs/heads/fix/whatsapp-checkout-flow-20261010' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '2e7036ffb197c93f4a990e9341b1b27ef585ce73'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the rehearsal offline
        run: node --test scripts/ppp-staging-checkout-flow-rehearsal.test.cjs
      - name: Execute the bounded checkout-flow rehearsal
        env:
          STAGING_CHECKOUT_FLOW_EXECUTE: ${{ (github.event_name == 'push' || inputs.execute) && 'true' || 'false' }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: node scripts/ppp-staging-checkout-flow-rehearsal.cjs
      - name: Archive sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-checkout-flow-report
          path: tmp/ppp-staging-checkout-flow-report.json
          retention-days: 7
          if-no-files-found: ignore
