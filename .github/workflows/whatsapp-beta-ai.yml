
name: WhatsApp Beta AI Tests

on:
  push:
    branches:
      - fix/whatsapp-regression-baseline
    paths:
      - .github/workflows/whatsapp-beta-ai.yml
      - scripts/whatsapp-beta-ai-rehearsal.ts
      - scripts/whatsapp-beta-cart-assertions.ts
      - scripts/whatsapp-beta-api-usage.ts
      - src/whatsapp/whatsapp-agent.service.ts
      - src/whatsapp/whatsapp-openai-request.ts
      - src/whatsapp/whatsapp-catalog.service.ts
      - src/whatsapp/whatsapp-agent.spec.ts
      - src/whatsapp/whatsapp-agent.language.spec.ts
      - src/whatsapp/whatsapp-action-guard.service.ts
      - src/whatsapp/whatsapp-orchestrator.service.ts
      - src/whatsapp/whatsapp-cart-integration.spec.ts
      - scripts/fixtures/whatsapp-beta-menu.json
      - scripts/fixtures/whatsapp-beta-cases.json
      - scripts/fixtures/whatsapp-beta-human-intents.json
      - scripts/fixtures/whatsapp-beta-hard-conversations.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-tests:
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-4o-mini]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify test secret is available (without exposing it)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY unavailable in Actions secrets"
            exit 1
          fi

      - name: Run AI simulations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_CASE_LIMIT: '6'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: yarn beta:whatsapp:ai

      - name: Human intent meals-meat (12 scenarios)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'human'
          WHATSAPP_BETA_CASE_LIMIT: '12'
          WHATSAPP_BETA_CASE_OFFSET: '0'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/whatsapp-beta-human-meals-meat.json
          echo "$result" > tmp/human-meals-meat-exit.txt
          exit "$result"

      - name: Archive human intent meals-meat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-human-meals-meat-${{ matrix.model }}
          path: tmp/whatsapp-beta-human-meals-meat.json
          retention-days: 7
          if-no-files-found: warn

      - name: Human intent drinks-desserts (12 scenarios)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'human'
          WHATSAPP_BETA_CASE_LIMIT: '12'
          WHATSAPP_BETA_CASE_OFFSET: '12'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/whatsapp-beta-human-drinks-desserts.json
          echo "$result" > tmp/human-drinks-desserts-exit.txt
          exit "$result"

      - name: Archive human intent drinks-desserts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-human-drinks-desserts-${{ matrix.model }}
          path: tmp/whatsapp-beta-human-drinks-desserts.json
          retention-days: 7
          if-no-files-found: warn

      - name: Human intent business-info (9 scenarios)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'human'
          WHATSAPP_BETA_CASE_LIMIT: '9'
          WHATSAPP_BETA_CASE_OFFSET: '24'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/whatsapp-beta-human-business-info.json
          echo "$result" > tmp/human-business-info-exit.txt
          exit "$result"

      - name: Archive human intent business-info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-human-business-info-${{ matrix.model }}
          path: tmp/whatsapp-beta-human-business-info.json
          retention-days: 7
          if-no-files-found: warn

      - name: Hard conversations attributes
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '12'
          WHATSAPP_BETA_CASE_OFFSET: '0'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          code=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/hard-attributes.json
          echo "$code" > tmp/hard-attributes-exit.txt
          exit "$code"

      - name: Archive hard attributes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-attributes-${{ matrix.model }}
          path: tmp/hard-attributes.json
          retention-days: 7
          if-no-files-found: warn

      - name: Hard conversations notes-multi
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '10'
          WHATSAPP_BETA_CASE_OFFSET: '12'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          code=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/hard-notes-multi.json
          echo "$code" > tmp/hard-notes-multi-exit.txt
          exit "$code"

      - name: Archive hard notes-multi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-notes-multi-${{ matrix.model }}
          path: tmp/hard-notes-multi.json
          retention-days: 7
          if-no-files-found: warn

      - name: Hard conversations ambiguity
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '8'
          WHATSAPP_BETA_CASE_OFFSET: '22'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          code=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/hard-ambiguity.json
          echo "$code" > tmp/hard-ambiguity-exit.txt
          exit "$code"

      - name: Archive hard ambiguity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-ambiguity-${{ matrix.model }}
          path: tmp/hard-ambiguity.json
          retention-days: 7
          if-no-files-found: warn

      - name: Follow-up conversations (29 scenarios, two repetitions)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '29'
          WHATSAPP_BETA_CASE_OFFSET: '30'
          WHATSAPP_BETA_REPEATS: '2'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: |
          set +e
          yarn beta:whatsapp:ai
          code=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/hard-followup.json
          echo "$code" > tmp/hard-followup-exit.txt
          exit "$code"

      - name: Archive follow-up conversations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-followup-${{ matrix.model }}
          path: tmp/hard-followup.json
          retention-days: 7
          if-no-files-found: error

      - name: Final conversation acceptance gate
        if: always()
        run: |
          failed=0
          for suite in human-meals-meat human-drinks-desserts human-business-info hard-attributes hard-notes-multi hard-ambiguity hard-followup; do
            result="tmp/${suite}-exit.txt"
            if [ ! -f "$result" ] || [ "$(cat "$result")" != "0" ]; then
              echo "::error::Conversation suite failed or missing: $suite"
              failed=1
            fi
          done
          exit "$failed"

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-report-${{ matrix.model }}
          path: tmp/whatsapp-beta-ai-report.json
          retention-days: 7
          if-no-files-found: warn

  everyday-conversations:
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-4o-mini]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Everyday PPP conversations (32 scenarios, two repetitions)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_OFFSET: '59'
          WHATSAPP_BETA_CASE_LIMIT: '32'
          WHATSAPP_BETA_REPEATS: '2'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: yarn beta:whatsapp:ai
      - name: Archive everyday conversations and actual cart assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-everyday-conversations-${{ matrix.model }}
          path: tmp/whatsapp-beta-ai-report.json
          retention-days: 7
          if-no-files-found: error

  cart-edit-conversations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        offset: [91, 115]
        model: [gpt-4o-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cart edits and independent variants (24 scenarios, two repetitions)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_OFFSET: ${{ matrix.offset }}
          WHATSAPP_BETA_CASE_LIMIT: '24'
          WHATSAPP_BETA_REPEATS: '2'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: yarn beta:whatsapp:ai
      - name: Archive cart edit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-cart-edits-${{ matrix.offset }}-${{ matrix.model }}
          path: tmp/whatsapp-beta-ai-report.json
          retention-days: 7
          if-no-files-found: error

  real-chat-regressions:
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-4o-mini]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Anonymized real-chat patterns (8 scenarios, two repetitions)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_OFFSET: '139'
          WHATSAPP_BETA_CASE_LIMIT: '8'
          WHATSAPP_BETA_REPEATS: '2'
          WHATSAPP_BETA_MODEL: '${{ matrix.model }}'
        run: yarn beta:whatsapp:ai
      - name: Archive real-chat regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-real-chat-patterns-${{ matrix.model }}
          path: tmp/whatsapp-beta-ai-report.json
          retention-days: 7
          if-no-files-found: error

  quality-candidate-gpt41:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WHATSAPP_BETA_LIVE: '1'
      WHATSAPP_BETA_MODEL: 'gpt-4.1-2025-04-14'
      WHATSAPP_BETA_REQUEST_INTERVAL_MS: '1500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: GPT-4.1 basic (6 executions)
        continue-on-error: true
        env:
          WHATSAPP_BETA_SUITE: 'basic'
          WHATSAPP_BETA_CASE_LIMIT: '6'
          WHATSAPP_BETA_CASE_OFFSET: '0'
          WHATSAPP_BETA_REPEATS: '1'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/gpt41-basic.json
          echo "$result" > tmp/gpt41-basic-exit.txt
          exit "$result"
      - name: GPT-4.1 human (33 executions)
        continue-on-error: true
        env:
          WHATSAPP_BETA_SUITE: 'human'
          WHATSAPP_BETA_CASE_LIMIT: '33'
          WHATSAPP_BETA_CASE_OFFSET: '0'
          WHATSAPP_BETA_REPEATS: '1'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/gpt41-human.json
          echo "$result" > tmp/gpt41-human-exit.txt
          exit "$result"
      - name: GPT-4.1 hard-initial (30 executions)
        continue-on-error: true
        env:
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '30'
          WHATSAPP_BETA_CASE_OFFSET: '0'
          WHATSAPP_BETA_REPEATS: '1'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/gpt41-hard-initial.json
          echo "$result" > tmp/gpt41-hard-initial-exit.txt
          exit "$result"
      - name: GPT-4.1 hard-repeated (234 executions)
        continue-on-error: true
        env:
          WHATSAPP_BETA_SUITE: 'hard'
          WHATSAPP_BETA_CASE_LIMIT: '117'
          WHATSAPP_BETA_CASE_OFFSET: '30'
          WHATSAPP_BETA_REPEATS: '2'
        run: |
          set +e
          yarn beta:whatsapp:ai
          result=$?
          set -e
          cp tmp/whatsapp-beta-ai-report.json tmp/gpt41-hard-repeated.json
          echo "$result" > tmp/gpt41-hard-repeated-exit.txt
          exit "$result"
      - name: GPT-4.1 acceptance gate
        if: always()
        run: |
          failed=0
          for suite in basic human hard-initial hard-repeated; do
            result="tmp/gpt41-${suite}-exit.txt"
            if [ ! -f "$result" ] || [ "$(cat "$result")" != "0" ]; then
              echo "::error::GPT-4.1 suite failed or missing: $suite"
              failed=1
            fi
          done
          exit "$failed"
      - name: Archive GPT-4.1 sequential comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-quality-gpt-4.1-2025-04-14
          path: tmp/gpt41-*.json
          retention-days: 7
          if-no-files-found: error
