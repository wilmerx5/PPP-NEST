
name: WhatsApp Beta AI Tests

on:
  push:
    branches:
      - fix/whatsapp-regression-baseline
    paths:
      - .github/workflows/whatsapp-beta-ai.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify test secret is available (without exposing it)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY unavailable in Actions secrets"
            exit 1
          fi

      - name: Run AI simulations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHATSAPP_BETA_LIVE: '1'
          WHATSAPP_BETA_CASE_LIMIT: '2'
          WHATSAPP_BETA_MODEL: 'gpt-4o-mini'
        run: yarn beta:whatsapp:ai

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-beta-report
          path: tmp/whatsapp-beta-ai-report.json
          retention-days: 7
          if-no-files-found: warn
