name: PPP Staging Human Service Rehearsal

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/ppp-staging-human-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: Run the bounded address and correction rehearsal on the authorized recipient
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ppp-staging-authorized-human
  cancel-in-progress: false

jobs:
  human:
    if: >-
      github.repository == 'wilmerx5/PPP-NEST' &&
      github.ref == 'refs/heads/fix/whatsapp-regression-baseline' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '2a0affb097d6c896dd86ec91ca5a3f493ba06a1d'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the rehearsal offline
        run: node --test scripts/ppp-staging-human-rehearsal.test.cjs
      - name: Execute the bounded human-service rehearsal
        env:
          STAGING_HUMAN_EXECUTE: ${{ inputs.execute && 'true' || 'false' }}
          STAGING_HUMAN_CLEANUP: ${{ github.event_name == 'push' && 'true' || 'false' }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          STAGING_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }}
          STAGING_WHATSAPP_RECIPIENTS: ${{ secrets.STAGING_WHATSAPP_RECIPIENTS }}
        run: node scripts/ppp-staging-human-rehearsal.cjs
      - name: Archive sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppp-staging-human-report
          path: tmp/ppp-staging-human-report.json
          retention-days: 7
          if-no-files-found: ignore
