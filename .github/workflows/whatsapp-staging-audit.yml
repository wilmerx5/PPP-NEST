name: PPP Staging Read-only DB Audit

on:
  push:
    branches: [fix/whatsapp-regression-baseline]
    paths: [.github/workflows/whatsapp-staging-audit.yml]
  pull_request:
    paths:
      - src/whatsapp/**
      - src/orders/**
      - src/products/**
      - src/common/migrations/**
      - scripts/whatsapp-staging-db-audit.ts
      - docs/ppp-staging-test-requirements.md
      - .github/workflows/whatsapp-staging-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # One controlled run from the reviewed revision, plus the existing opt-in.
    if: vars.PPP_STAGING_DB_AUDIT == 'true' || (github.event_name == 'push' && github.event.before == '31a28323b4fd03140bf2a2665500de2ca1bbabef' && github.ref == 'refs/heads/fix/whatsapp-regression-baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 31a28323b4fd03140bf2a2665500de2ca1bbabef
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Inspect staging schema and catalog without writes
        env:
          PPP_STAGING_DB_AUDIT: '1'
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
          DB_SSL_CA: ${{ secrets.STAGING_DB_SSL_CA }}
        run: yarn ts-node -r tsconfig-paths/register scripts/whatsapp-staging-db-audit.ts
